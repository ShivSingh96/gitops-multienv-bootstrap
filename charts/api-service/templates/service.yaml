apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-service.name" . }}
  labels:
    {{- include "api-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "api-service.selectorLabels" . | nindent 4 }}
  ports:
  - name: http
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}
    protocol: TCP
